backend:
  name: github
  repo: ranocodes/bmac-next
  branch: main
  base_url: https://bmac-next.vercel.app
  auth_endpoint: api/auth

local_backend: true # Allows local development via decap-server

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "programs"
    label: "Programs"
    folder: "content/programs"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{id}}"
    identifier_field: "id"
    fields:
      - { label: "ID", name: "id", widget: "string" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Teaser Description", name: "desc", widget: "string" }
      - { label: "Body Content", name: "body", widget: "markdown" }
      - { label: "Image", name: "img", widget: "image" }
      - { label: "Icon Name", name: "icon", widget: "string", hint: "Lucide icon name e.g. Mic, Users, Trophy" }
      - { label: "Color Class", name: "color", widget: "string", hint: "Tailwind color class e.g. bg-emerald-50 text-emerald-600" }
      - { label: "Logistics", name: "details", widget: "string", hint: "Separate with | pipes" }
      - { label: "Layout Variant", name: "variant", widget: "select", options: ["default", "featured"] }

  - name: "events"
    label: "Official Events"
    folder: "content/events"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{id}}"
    identifier_field: "id"
    fields:
      - { label: "ID", name: "id", widget: "string" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "string", hint: "e.g. March 15, 2026" }
      - { label: "Time", name: "time", widget: "string", hint: "e.g. 09:00 AM" }
      - { label: "Venue", name: "venue", widget: "string" }
      - { 
          label: "Category", 
          name: "category", 
          widget: "relation", 
          collection: "settings", 
          file: "categories", 
          search_fields: ["categories.*"], 
          display_fields: ["categories.*"], 
          value_field: "categories.*" 
        }
      - { label: "Paid Event?", name: "isPaid", widget: "boolean", default: false }
      - { label: "Ticket Price", name: "price", widget: "number", default: 0, required: false, value_type: "int" }
      - { label: "Teaser", name: "desc", widget: "string" }
      - { label: "Full Details", name: "body", widget: "markdown" }

  - name: "news"
    label: "News & Chronicle"
    folder: "content/news"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{id}}"
    identifier_field: "id"
    fields:
      - { label: "ID", name: "id", widget: "string" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "string" }
      - { 
          label: "Category", 
          name: "category", 
          widget: "relation", 
          collection: "settings", 
          file: "categories", 
          search_fields: ["categories.*"], 
          display_fields: ["categories.*"], 
          value_field: "categories.*" 
        }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Teaser", name: "desc", widget: "string" }
      - { label: "Image", name: "img", widget: "image" }
      - { label: "Article Content", name: "body", widget: "markdown" }

  - name: "settings"
    label: "Global Settings"
    delete: false
    editor:
      preview: false
    files:
      - name: "categories"
        label: "Category Manager"
        file: "content/settings/categories.json"
        fields:
          - name: categories
            label: Registry
            widget: list
            summary: "{{fields.categories}}"
            field: { label: "Category Name", name: "category", widget: "string" }

      - name: "site"
        label: "Identity & Branding"
        file: "content/settings/site.json"
        fields:
          - { label: "Logo Text", name: "logo_text", widget: "string" }
          - { label: "Copyright Notice", name: "copyright", widget: "string" }
          - name: social_links
            label: Social Connectivity
            widget: list
            fields:
              - { label: "Platform Name", name: "name", widget: "string" }
              - { label: "Link URL", name: "href", widget: "string" }
              - { label: "Icon Name", name: "icon", widget: "string", hint: "Lucide name" }
          - name: navigation
            label: Main Navigation
            widget: list
            fields:
              - { label: "Link Label", name: "name", widget: "string" }
              - { label: "Link Path", name: "href", widget: "string" }

      - name: "team"
        label: "Team Members"
        file: "content/settings/team.json"
        fields:
          - name: members
            label: Members
            widget: list
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Image", name: "img", widget: "image" }

      - name: "stats"
        label: "Impact Stats"
        file: "content/settings/stats.json"
        fields:
          - name: stats
            label: Stats
            widget: list
            fields:
              - { label: "Value", name: "num", widget: "string", hint: "e.g. 350+" }
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Icon Name", name: "icon", widget: "string", hint: "Lucide icon name" }

      - name: "gallery"
        label: "Gallery Archive"
        file: "content/settings/gallery.json"
        fields:
          - name: items
            label: Images
            widget: list
            fields:
              - { label: "Image", name: "img", widget: "image" }
              - { 
                  label: "Category", 
                  name: "category", 
                  widget: "relation", 
                  collection: "settings", 
                  file: "categories", 
                  search_fields: ["categories.*"], 
                  display_fields: ["categories.*"], 
                  value_field: "categories.*" 
                }
              - { label: "Alt Text", name: "alt", widget: "string" }

      - name: "testimonials"
        label: "Testimonials"
        file: "content/settings/testimonials.json"
        fields:
          - name: testimonials
            label: Quotes
            widget: list
            fields:
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Author Name", name: "name", widget: "string" }
              - { label: "Designation", name: "designation", widget: "string" }
              - { label: "Author Image", name: "src", widget: "image" }
